<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — QuiZapp</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="page">
    <nav class="nav">
      <a class="brand" href="/pages/index.html">QuiZ<span>app</span></a>
      <div class="nav-links" data-auth-nav></div>
    </nav>

    <main class="container-sm">
      <section class="glass" style="padding:2rem">
        <h1>Forgot password</h1>
        <p class="lead">Enter the email for your QuiZapp account. If it exists, we will send a reset link.</p>

        <form id="forgotForm" style="margin-top:1.5rem">
          <div class="form-group">
            <label for="email">Email</label>
            <input id="email" class="form-control" type="email" required autocomplete="email" />
          </div>
          <p class="form-error" id="formError"></p>
          <p class="muted" id="formSuccess" style="display:none;margin-bottom:1rem"></p>
          <button class="btn btn-block" type="submit">Send reset link</button>
        </form>

        <p class="muted text-center" style="margin-top:1.25rem">
          <a href="/pages/login.html" style="color:var(--accent)">Back to login</a>
        </p>
      </section>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/pages/auth.js"></script>
</body>
</html>
