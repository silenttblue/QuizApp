<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — QuiZapp</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="page">
    <nav class="nav">
      <a class="brand" href="/pages/index.html">QuiZ<span>app</span></a>
      <div class="nav-links" data-auth-nav></div>
    </nav>

    <main class="container-sm">
      <section class="glass" style="padding:2rem">
        <h1>Login</h1>
        <p class="lead">Access your profile, quiz history, and creator tools.</p>

        <form id="loginForm" style="margin-top:1.5rem">
          <div class="form-group">
            <label for="email">Email</label>
            <input id="email" class="form-control" type="email" required autocomplete="email" />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input id="password" class="form-control" type="password" required minlength="6" autocomplete="current-password" />
          </div>
          <p class="form-error" id="formError"></p>
          <button class="btn btn-block" type="submit">Login</button>
        </form>

        <p class="muted text-center" style="margin-top:1.25rem">
          No account? <a href="/pages/signup.html" style="color:var(--accent)">Sign up</a>
        </p>
      </section>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/pages/auth.js"></script>
</body>
</html>
