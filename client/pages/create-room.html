<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Room — QuiZapp</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="page">
    <nav class="nav">
      <a class="brand" href="/pages/index.html">QuiZ<span>app</span></a>
      <div class="nav-links" data-auth-nav></div>
    </nav>

    <main class="container-sm">
      <section class="glass" style="padding:2rem">
        <h1>Create Room</h1>
        <p class="lead">Hosting as <strong id="hostName"></strong>. Configure the quiz, then share your room code.</p>

        <form id="createRoomForm" style="margin-top:1.5rem">
          <div class="form-group">
            <label for="category">Category</label>
            <select id="category" class="form-control"></select>
          </div>
          <div class="form-group">
            <label for="difficulty">Difficulty</label>
            <select id="difficulty" class="form-control">
              <option value="easy">Easy</option>
              <option value="medium" selected>Medium</option>
              <option value="hard">Hard</option>
              <option value="any">Any</option>
            </select>
          </div>
          <div class="form-group">
            <label for="amount">Questions</label>
            <select id="amount" class="form-control">
              <option value="5">5</option>
              <option value="10" selected>10</option>
              <option value="15">15</option>
            </select>
          </div>
          <div class="form-group">
            <label for="customQuiz">Or use a custom quiz</label>
            <select id="customQuiz" class="form-control"></select>
          </div>

          <div class="btn-row">
            <a class="btn btn-ghost" href="/pages/index.html">Back</a>
            <button class="btn" type="submit">Create &amp; Enter Lobby</button>
          </div>
        </form>
      </section>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/pages/create-room.js"></script>
</body>
</html>
