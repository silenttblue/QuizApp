<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — QuiZapp</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="page">
    <nav class="nav">
      <a class="brand" href="/pages/index.html">QuiZ<span>app</span></a>
      <div class="nav-links" data-auth-nav></div>
    </nav>

    <main class="container-sm">
      <section class="glass" style="padding:2rem">
        <h1>Reset password</h1>
        <p class="lead">Choose a new password for your account. The link from your email is single-use and time-limited.</p>

        <form id="resetForm" style="margin-top:1.5rem">
          <input type="hidden" id="token" />
          <div class="form-group">
            <label for="password">New password</label>
            <input id="password" class="form-control" type="password" required minlength="6" autocomplete="new-password" />
          </div>
          <div class="form-group">
            <label for="confirm">Confirm new password</label>
            <input id="confirm" class="form-control" type="password" required minlength="6" autocomplete="new-password" />
          </div>
          <p class="form-error" id="formError"></p>
          <button class="btn btn-block" type="submit">Update password</button>
        </form>

        <p class="muted text-center" style="margin-top:1.25rem">
          <a href="/pages/login.html" style="color:var(--accent)">Back to login</a>
        </p>
      </section>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/pages/auth.js"></script>
</body>
</html>
